apiVersion: apps/v1
kind: Deployment
metadata:
  name: dinoforge-mcp
  namespace: dinoforge
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dinoforge-mcp
  template:
    metadata:
      labels:
        app: dinoforge-mcp
    spec:
      containers:
        - name: mcp-server
          image: ghcr.io/kooshapari/dinoforge-mcp:latest
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
