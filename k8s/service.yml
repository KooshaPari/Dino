apiVersion: v1
kind: Service
metadata:
  name: dinoforge-mcp
  namespace: dinoforge
  labels:
    app: dinoforge-mcp
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app: dinoforge-mcp
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
