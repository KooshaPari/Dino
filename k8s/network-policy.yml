apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dinoforge-mcp-netpol
  namespace: dinoforge
spec:
  podSelector:
    matchLabels:
      app: dinoforge-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: dinoforge
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    - to:
        - podSelector:
            matchLabels:
              app: game-server
      ports:
        - protocol: TCP
          port: 19000
