apiVersion: apps/v1
kind: Deployment
metadata:
  name: dinoforge-mcp
  namespace: dinoforge
  labels:
    app: dinoforge-mcp
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dinoforge-mcp
  template:
    metadata:
      labels:
        app: dinoforge-mcp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: mcp-server
          image: ghcr.io/kooshapari/dinoforge-mcp:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
          env:
            - name: DINOFORGE_PIPE_NAME
              value: "/mnt/pipe/DINoF_Pipe"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dinoforge-config
