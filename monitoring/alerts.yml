groups:
  - name: dinoforge-slo
    rules:
      - alert: HighErrorRate
        expr: rate(dinoforge_http_requests_total{status=~"5.."}[5m]) / rate(dinoforge_http_requests_total[5m]) > 0.10
        for: 5m
        labels:
            severity: critical
        annotations:
            summary: High error rate on DINOFORGE MCP
      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(dinoforge_tool_duration_seconds_bucket[5m])) > 2
        for: 10m
        labels:
            severity: warning
        annotations:
            summary: High latency on DINOFORGE MCP tools
      - alert: sLOBreachWarning
        expr: dinoforge_slo_error_budget_remaining < 0.1
        for: 5m
        labels:
            severity: warning
        annotations:
            summary: SLO error budget below 10%