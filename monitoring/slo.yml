service: dinoforge-mcp
version: 1.0.0

objectives:
  - name: api_availability
    description: MCP server API uptime
    target: 99.9%
    window: 30d
  - name: api_latency
    description: MCP tool response latency
    target: 99.0%
    window: 30d
  - name: game_launch_success
    description: Game launch validation success rate
    target: 99.5%
    window: 7d
  - name: pack_validation_success
    description: Pack validation pass rate
    target: 99.0%
    window: 30d
