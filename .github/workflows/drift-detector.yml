name: drift-detector
# Weekly app-substrate drift detector (ADR-043, ADR-044 backup path).
#
# Scans this CONDITIONAL app repo weekly (Wed 09:00 PDT) and files a
# `drift-detector@phenotype` issue on any drift hit (score >= 1.5 per ADR-043).
# This is the GitHub Actions BACKUP for the heavy-runner cron (ADR-044 §2.2):
# Actions runs only when the heavy-runner is unavailable.
#
# === DINO HIGH-LEVERAGE NOTE ===
# Per ADR-043 §"Retroactive scoring", Dino engine primitives are EXPECTED to
# flag on the first run (score ~8.4). This is a known-but-unactioned
# opportunity. The first scheduled run will likely file the very issue that
# kicks off a future `pheno-engine` extraction ADR.
# See findings/2026-06-18-L8-009-app-substrate-drift.md for the scoring rationale.
#
# Per AGENTS.md "App substrate triage" Dino is CONDITIONAL: engine / non-frontend
# work permitted, UI/HUD/UX work paused. Drift detector hits in the engine/
# primitives area are substrate candidates; hits in UI/ are expected and skipped
# by the detector's SKIP_DIRS heuristic.
#
# Action reference strategy: the drift detector is a Python CLI
# (`pheno-drift-detector/pheno_drift_detector.py`), not a packaged GitHub
# Action. We download the raw script via curl from `KooshaPari/pheno-drift-detector@main`
# and run it with python3.
#
# See:
#   - docs/adr/2026-06-18/ADR-043-app-substrate-drift-detector.md
#   - docs/adr/2026-06-18/ADR-044-cron-deployment.md
#   - findings/2026-06-18-L8-009-app-substrate-drift.md (retroactive scoring)

on:
  schedule:
    - cron: '0 16 * * 3'  # Wed 09:00 PDT (= 16:00 UTC during PDT)
  workflow_dispatch:
    inputs:
      detector_sha:
        description: 'pheno-drift-detector commit SHA to pin (default: main HEAD)'
        required: false
        default: 'main'

permissions:
  contents: read
  issues: write

jobs:
  drift-detect:
    name: pheno-drift-detector scan (Dino engine primitives)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout app repo (full history for stability scoring)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download pheno-drift-detector CLI
        env:
          DETECTOR_REF: ${{ github.event.inputs.detector_sha || 'main' }}
        run: |
          mkdir -p .drift-detector
          curl -fsSL \
            "https://raw.githubusercontent.com/KooshaPari/pheno-drift-detector/${DETECTOR_REF}/pheno_drift_detector.py" \
            -o .drift-detector/pheno_drift_detector.py
          python3 .drift-detector/pheno_drift_detector.py --help >/dev/null

      - name: Run pheno-drift-detector scan
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p findings
          python3 .drift-detector/pheno_drift_detector.py scan \
            --root . \
            --format gh-issues \
            --out "findings/drift-hits-${RUN_ID}.md" \
            || EXIT=$?
          # Exit 0 = no hits (clean run)
          # Exit 2 = hits found (expected; we file an issue below)
          # Exit 1 = scan error (fail the workflow)
          echo "exit_code=${EXIT:-0}" >> "$GITHUB_ENV"
          if [ "${EXIT:-0}" = "1" ]; then
            echo "drift-detector scan failed"
            exit 1
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-detector-output
          path: findings/drift-hits-*.md
          if-no-files-found: ignore

      - name: File drift-detector issue on hit
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          OUT="findings/drift-hits-${RUN_ID}.md"
          if [ ! -s "$OUT" ]; then
            echo "No drift hits — skipping issue filing."
            exit 0
          fi
          HITS=$(grep -c '^## Drift detected' "$OUT" || echo 0)
          # Prepend a Dino-specific header so reviewers see the ADR-043 retroactive
          # context immediately on the filed issue.
          TMP="findings/drift-hits-${RUN_ID}.with-context.md"
          {
            echo "<!-- drift-detector@phenotype — Dino retroactive context -->"
            echo ""
            echo "> **Dino retroactive context (ADR-043 §Retroactive scoring):**"
            echo "> This repo is in the CONDITIONAL bucket per AGENTS.md."
            echo "> Dino engine primitives are EXPECTED to flag (score ~8.4, see"
            echo "> \`findings/2026-06-18-L8-009-app-substrate-drift.md\`). If this issue"
            echo "> shows the engine primitives cluster, the next step is an extraction"
            echo "> ADR for \`pheno-engine\` (per ADR-023 Rule 3 substrate placement)."
            echo ""
            cat "$OUT"
          } > "$TMP"
          mv "$TMP" "$OUT"
          TITLE="drift-detector: ${HITS} hit(s) in $(basename $GITHUB_REPOSITORY) @ $(date -u +%Y-%m-%d)"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --label "drift-detector" \
            --title "$TITLE" \
            --body-file "$OUT"