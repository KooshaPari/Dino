name: Deny (cargo-deny)

# Enforces license, advisory, ban, and source policies defined in deny.toml.
# Triggered on push to main, on PRs, weekly Tuesday 06:00 UTC, and on-demand.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 2'  # Tuesdays 06:00 UTC (offset from audit)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4f7d6f4d2a4d8c5e0e3b7c1a9d2f4e6b8c1a9d2f # stable

      - name: Cache cargo registry and index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deny-

      - name: Install cargo-deny
        uses: taiki-e/install-action@4f0b1e5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b # v2

      - name: Validate deny.toml schema
        run: cargo deny --version

      - name: Run cargo deny check
        working-directory: src/Tools/AssetPipelineRust
        run: |
          cd "$GITHUB_WORKSPACE"
          cargo deny check
          cargo deny check advisories
          cargo deny check licenses
          cargo deny check bans
          cargo deny check sources
