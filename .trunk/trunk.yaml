# =============================================================================
# Trunk.io - Plugin versions for linting/formatting tools
# =============================================================================
# https://docs.trunk.io/check/reference
# =============================================================================

version: 0.1

plugins:
  sources:
    - id: trunk
      ref: v1.2.2
    - id: community
      ref: main

# Linters (auto-detected by file type)
linters:
  enabled:
    - actionlint
    - black
    - clippy
    - eslint
    - golangci-lint
    - mypy
    - ruff
    - shellcheck
    - taplo
    - yamllint

# Formatters
formatters:
  enabled:
    - black
    - prettier
    - rustfmt

# Actions (CI optimization)
actions:
  enabled:
    - trunk-check
    - trunk-merge
    - trunk-push
